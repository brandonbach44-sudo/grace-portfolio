name: Update site from Google Drive

on:
  schedule:
    - cron: '17 * * * *'      # every hour
  workflow_dispatch:           # "Run workflow" button
    inputs:
      preview:
        description: 'Only show the Drive folder layout (changes nothing)'
        type: boolean
        default: false
  push:                        # a normal commit just republishes what's in the repo
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

env:
  DRIVE_FOLDER_ID: 1Ip7fU7SVthpRMHMPWj5p4pB50GeMBCov

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}site/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install tools
        if: github.event_name != 'push'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer libreoffice-impress libreoffice-calc \
            imagemagick poppler-utils fonts-liberation fonts-dejavu-core fonts-crosextra-carlito fonts-crosextra-caladea > /dev/null
          pip install -q -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium > /dev/null

      - name: Show Drive folder layout
        if: inputs.preview
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: python pipeline/preview.py "$DRIVE_FOLDER_ID"

      - name: Pull Grace's Drive folder and rebuild the site
        if: github.event_name != 'push' && !inputs.preview
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: python pipeline/update.py --drive "$DRIVE_FOLDER_ID"

      - name: Save changes
        id: save
        if: github.event_name != 'push' && !inputs.preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site pipeline/state
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; echo "No changes in Drive."; else
            git commit -q -m "Update site from Google Drive" && git push -q && echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Package site
        if: (steps.save.outputs.changed == 'true' || github.event_name != 'schedule') && !inputs.preview
        run: |
          mkdir _deploy
          cp -r site _deploy/site
          cp index.html option-*.html _deploy/ 2>/dev/null || true
          touch _deploy/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: (steps.save.outputs.changed == 'true' || github.event_name != 'schedule') && !inputs.preview
        with:
          path: _deploy

      - id: deploy
        if: (steps.save.outputs.changed == 'true' || github.event_name != 'schedule') && !inputs.preview
        uses: actions/deploy-pages@v4
